# k8s/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  # Назва вашого розгортання
  name: collabro-portal-deployment
  labels:
    app: collabro-portal
spec:
  # Скільки копій (подів) застосунку ви хочете запустити
  replicas: 3
  selector:
    matchLabels:
      app: collabro-portal
  template:
    metadata:
      labels:
        app: collabro-portal
    spec:
      containers:
        - name: collabroportal-angular-dev-1
          # >>> ОБОВ'ЯЗКОВО ЗАМІНИТИ НА ВАШ ШЛЯХ І ОБРАЗ <<<
          image: collabroportal-angular-dev
          # Порт, на якому Nginx слухає всередині контейнера
          ports:
            - containerPort: 80
          resources:
            limits:
              memory: "128Mi"
              cpu: "500m"
            requests:
              memory: "64Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
