<div [ngClass]="{'paginator': wrapper === 'flex', 'paginator-grid': wrapper === 'grid'}"
     [ngStyle]="{'flex-direction': flexDirection}"
     (scroll)="onListScroll($event)"
     class="paginator">
  <ng-content></ng-content>

  <div *ngIf="showMoreButton && loadDataByClick" class="show-more-wrapper">
    <button (click)="loadData()" mat-button class="button-primary">{{'general.showMoreLabel' | translate}}
    </button>
  </div>
</div>
