<div class="modal-wrapper">

  <mat-tab-group animationDuration="0ms"
                 mat-stretch-tabs="false"
                 mat-align-tabs="start"
                 class="h-100">
    <mat-tab label="{{'developers.profileLabel' | translate}}">
      <collabro-developer-profile [developer]="data?.developer"
                                  [developerAvatar]="data?.developerAvatar"/>
    </mat-tab>

    <mat-tab label="{{'developers.feedbacksLabel' | translate}}">
      <collabro-paginator class="h-100">
        <collabro-developer-comments (loadData)="loadingFeedbacks($event)"
                                     [developerId]="data?.developer?.id"
                                     [feedbacks]="feedbacks" [imageData]="imageData"/>
      </collabro-paginator>
    </mat-tab>
  </mat-tab-group>
</div>

<div class="button-container">
  <button mat-dialog-close class="transparent-button" mat-button>
    {{ 'general.cancelLabel' | translate }}
  </button>
  <button class="button-purple big-button"
          (click)="openProjectsDialog(data?.developer.id)"
          mat-button>{{ 'general.inviteLabel' | translate }}
  </button>
</div>
