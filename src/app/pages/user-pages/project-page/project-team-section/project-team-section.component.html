<table mat-table class="m-t-2" [dataSource]="developers" *ngIf="developers?.length else emptyState">
  <ng-container matColumnDef="fullName">
    <th *matHeaderCellDef mat-header-cell>{{ 'general.fullNameLabel' | translate }}
    </th>

    <td *matCellDef="let element" class="fullName-column" mat-cell>
      {{ element.firstName }} {{ element.lastName }}
    </td>
  </ng-container>

  <ng-container matColumnDef="location">
    <th *matHeaderCellDef mat-header-cell>{{ 'myProject.locationLabel' | translate }}
    </th>

    <td *matCellDef="let element" class="location-column" mat-cell>
      {{ element.address?.countryCode }}, {{ element.address?.state }}, {{ element.address?.city }}
    </td>
  </ng-container>

  <ng-container matColumnDef="action">
    <th *matHeaderCellDef mat-header-cell>{{ 'general.actionLabel' | translate }}</th>

    <td *matCellDef="let element" class="action-column" mat-cell>
      <div class="table-items-basket">
        <button mat-icon-button
                (click)="openDeveloperInfoDialog(element)">
          <mat-icon [svgIcon]="'profile'"></mat-icon>
        </button>

        <button mat-icon-button
                (click)="removeDeveloperFromProject(element.id)">
          <mat-icon [svgIcon]="'delete'"></mat-icon>
        </button>
      </div>
    </td>
  </ng-container>

  <tr *matHeaderRowDef="developerTableColumns" mat-header-row></tr>

  <tr *matRowDef="let row; columns: developerTableColumns;" mat-row></tr>
</table>

<ng-template #emptyState>
  <div class="h-100">
    <div class="d-flex h-100 align-items-center justify-content-center">
      <collabro-empty-state [title]="('emptyState.notTeamMembersYetLabel' | translate)"
                            [subtitle]="('emptyState.yourProjectTeamIsEmptyLabel' | translate)"/>

    </div>
  </div>
</ng-template>
