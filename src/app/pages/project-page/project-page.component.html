<div class="project-page-wrapper">
  <mat-tab-group animationDuration="0ms"
                 mat-stretch-tabs="false"
                 mat-align-tabs="start"
                 class="h-100">
    <mat-tab label="{{'myProject.summaryLabel' | translate}}">
      <collabro-project-overview-section [project]="project" />
    </mat-tab>

    <mat-tab label="{{'myProject.teamLabel' | translate}}">
      <collabro-project-team-section [projectId]="project.id" />
    </mat-tab>

    <mat-tab label="{{'myProject.boardLabel' | translate}}">
      <collabro-project-board-section [projectId]="project.id"
                                      [developers]="project.developers" />
    </mat-tab>

    <mat-tab label="{{'myProject.requestsLabel' | translate}}">
      <collabro-project-requests-section [projectId]="project.id" />
    </mat-tab>


  </mat-tab-group>
</div>
