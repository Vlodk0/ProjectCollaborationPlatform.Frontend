<div class="profile-section-container">
  <div class="avatar-container">
    <div class="item-container-placeholder w-100">
      <mat-icon *ngIf="true; else avatarPhoto" class="item-container-placeholder-icon"
                [svgIcon]="'avatar-placeholder-icon'"></mat-icon>

      <ng-template #avatarPhoto>
        <img alt="" class="avatar-photo">
      </ng-template>
    </div>
    <div class="user-info-container">
      <div class="user-full-name"> Name Surname </div>
      <div class="user-role-name"> Developer</div>
    </div>
  </div>

  <div class="item-container">
    <div class="item-container-header-wrapper">
      <div class="item-container-header flex-wrap">
        <div class="title">Personal Information</div>
        <button class="button-primary"
                (click)="openUpdatePersonalInfoDialog()">
          <mat-icon [svgIcon]="'edit'"></mat-icon>
        </button>
      </div>
      <div class="d-flex justify-content-space-between flex-wrap">
        <div class="user-info-container row-gap-0-4 column-gap-0-4">
          <div class="info-title"> First Name*</div>
          <input class="input-wrapper" placeholder="John" />
        </div>

        <div class="user-info-container row-gap-0-4 column-gap-0-4">
          <div class="info-title"> Last Name*</div>
          <input class="input-wrapper" placeholder="Doe" />
        </div>

        <div class="user-info-container row-gap-0-4 column-gap-0-4">
          <div class="info-title">Email*</div>
          <input class="input-wrapper" placeholder="john.doe@gmail.com" />
        </div>
      </div>

      <div class="w-100">
        <div class="user-info-container m-t-2">
          <div class="info-title">Bio</div>
          <textarea class="text-area-wrapper" disabled="disabled" rows="5" placeholder="Lorem Ipsum"></textarea>
        </div>
      </div>
    </div>
  </div>

  <div class="item-container">
    <div class="item-container-header-wrapper">
      <div class="item-container-header">
        <div class="title">Address</div>
        <button class="button-primary"
                (click)="openAddressDialog()">
          <mat-icon [svgIcon]="'edit'"></mat-icon>
        </button>
      </div>
      <div class="d-flex justify-content-space-between flex-wrap">
        <div class="user-info-container">
          <div class="info-title"> Country</div>
          <input class="input-wrapper" placeholder="United State of America" />
        </div>

        <div class="user-info-container">
          <div class="info-title"> City</div>
          <input class="input-wrapper" placeholder="Los Angeles" />
        </div>

        <div class="user-info-container">
          <div class="info-title"> State</div>
          <input class="input-wrapper" placeholder="LA" />
        </div>
      </div>
    </div>
  </div>

  <div class="item-container">
    <div class="item-container-header-wrapper">
      <div class="item-container-header flex-wrap">
        <div class="title">{{'technologies.technologiesLabel' | translate}}</div>
        <button class="button-primary"
                (click)="openTechnologyDialog()">
          <mat-icon [svgIcon]="'edit'"></mat-icon>
        </button>
      </div>
      <div class="d-flex column-gap-0-4 flex-wrap row-gap-0-4">
        <div class="technology-item-container"
             *ngFor="let item of technologiesListConstant">
          {{ item.name | translate }}
        </div>
      </div>
    </div>
  </div>

  <div class="item-container">
    <div class="item-container-header-wrapper">
      <div class="item-container-header">
        <div class="title">{{ 'frameworks.frameworksLabel' | translate }}</div>
        <button class="button-primary"
                (click)="openFrameworkDialog()">
          <mat-icon [svgIcon]="'edit'"></mat-icon>
        </button>
      </div>
      <div class="d-flex column-gap-0-4 flex-wrap row-gap-0-4">
        <div class="technology-item-container"
             *ngFor="let item of frameworkListConstant">
          {{ item.name | translate }}
        </div>
      </div>
    </div>
  </div>
</div>
