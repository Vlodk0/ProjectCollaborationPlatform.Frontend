<div (click)="openDeveloperInfoDialog(developer)" class="card-wrapper flex-col">
  <div class="d-flex align-items-center">
    <div class="item-container-placeholder m-r-1-6 w-100">
      <mat-icon *ngIf="true; else avatarPhoto" class="item-container-placeholder-icon"
                [svgIcon]="'avatar-placeholder-icon'"></mat-icon>

      <ng-template #avatarPhoto>
        <img alt="" class="avatar-photo">
      </ng-template>
    </div>

    <div class="user-info-container">
      <div class="d-flex align-items-center w-100 column-gap-0-4">
        <div class="user-full-name"> {{ developer.firstName }} {{ developer.lastName }} </div>
        <div *ngIf="developer.address.countryCode">
          <div *ngIf="developer.address.countryCode === 'UA'; else otherCountry">
            <mat-icon [svgIcon]="'ukraine'"></mat-icon>
          </div>
          <ng-template #otherCountry>
            <mat-icon [svgIcon]="'usa'"></mat-icon>
          </ng-template>
        </div>
      </div>
      <div class="user-role-name"> {{ developer.address.state }}, {{ developer.address.countryName }}</div>
    </div>
  </div>

  <div class="technologies-container">
    <div class="technology-item-container w-100 d-flex justify-content-center"
         *ngFor="let item of developer.technologies.slice(0, 3)">
      {{ item.technology | translate }}
    </div>
    <div class="footer-label">+2</div>
  </div>
</div>
