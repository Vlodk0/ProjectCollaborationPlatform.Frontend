<div class="project-wrapper flex-col">
  <div class="project-subtitle">{{ project.type | projectTypeLabel | translate | uppercase }}</div>
  <div class="project-upper-section-wrapper">
    <div class="project-header">{{ project.title }}</div>
    <div class="d-flex align-items-center">
      <span class="project-price">{{ project.payment | currency }}</span>
      <span class="project-price-time">/hour</span>
    </div>
  </div>
  <div class="project-lower-section-wrapper">
    <div class="d-flex align-items-center">
      <mat-icon [svgIcon]="'project-duration-icon'"/>
      <p class="project-price-time">
        {{ project.timeDuration | timeDurationLabel | translate }}
      </p>
    </div>
    <div class="d-flex align-items-center">
      <mat-icon [svgIcon]="'project-duration-icon'"/>
      <p class="project-price-time">
        {{ project.createdTimeStamp | localDate: "shortDate" }}
      </p>
    </div>
  </div>
  <div class="d-flex align-items-center">
  </div>
</div>
