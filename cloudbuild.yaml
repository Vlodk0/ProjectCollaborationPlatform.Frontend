steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - '-t'
      - '$_GCR_HOSTNAME/$PROJECT_ID/$_SERVICE_NAME: $COMMIT_SHA'
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - run
      - deploy
      - $_SERVICE_NAME
      - '--image'
      - '$_GCR_HOSTNAME/$PROJECT_ID/$_SERVICE_NAME: $COMMIT_SHA'
      - '--region'
      - $_DEPLOY_REGION
      - '--platform'
      - $_PLATFORM
    entrypoint: gcloud
timeout: 1200s
options:
  logging: CLOUD_LOGGING_ONLY
images:
  - '$_GCR_HOSTNAME/$PROJECT_ID/$_SERVICE_NAME: $COMMIT_SHA'
